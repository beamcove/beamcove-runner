name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck start.sh job/job.sh
      - name: Image
        run: docker build -t beamcove-runner .
      - name: Job image
        run: docker build -t runner-job job
